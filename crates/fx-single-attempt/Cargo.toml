[package]
name = "fx-single-attempt"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Adapter from a single-attempt provider port to the fx-core Capability trait"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
fx-core = { path = "../fx-core" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
