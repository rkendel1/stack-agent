[package]
name = "chip-graph"
version = "0.1.0"
edition = "2024"
description = "Deterministic, content-addressed architecture graph snapshots of a Rust repository"
license = "MIT"

# The graph is a projection of source, never authority. This crate only reads source and
# depends on deterministic parsing and hashing: no runtime, model, network or process code.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
# `span-locations` gives source lines to the pattern observations; the graph itself does not use them.
proc-macro2 = { version = "1", features = ["span-locations"] }
toml = "0.8"
