[package]
name = "stack-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"

# `local-ml` adds the native local-model reasoner. It needs ONNX Runtime at build time
# (downloaded by the runtime's build script, or supplied via ORT_LIB_LOCATION), so it is off by default.
# The one product executable is `stack-agent` (Chip agent orchestration + FX inference). This crate
# was `chip-cli` in rkendel1/chip-rs; the library keeps the name `chip_cli` so every embedding path
# (`use chip_cli::...`) is unchanged. There is no second command-line program.
[lib]
name = "chip_cli"
path = "src/lib.rs"

[[bin]]
name = "stack-agent"
path = "src/main.rs"

[features]
local-ml = ["dep:chip-local-ml", "chip-local-ml/runtime"]
# Experimental native Laya (candle) reasoner; needs a local checkpoint directory, never downloads.
laya = ["dep:chip-laya-reasoner", "chip-laya-reasoner/laya"]

[dependencies]
chip-core = { path = "../chip-core" }
chip-graph = { path = "../chip-graph" }
chip-local-decision = { path = "../chip-local-decision" }
chip-decision-corpus = { path = "../chip-decision-corpus" }
chip-inference = { path = "../chip-inference" }
chip-compute = { path = "../chip-compute" }
chip-pax = { path = "../chip-pax" }
chip-project = { path = "../chip-project" }
chip-experiments = { path = "../chip-experiments" }
chip-remote-env = { path = "../chip-remote-env" }
chip-reasoning-corpus = { path = "../chip-reasoning-corpus" }
chip-local-ml = { path = "../chip-local-ml", optional = true }
chip-laya-reasoner = { path = "../chip-laya-reasoner", optional = true }
chip-wasm-reasoner = { path = "../chip-wasm-reasoner", features = ["fixture"] }
chip-wasm-decision = { path = "../chip-wasm-decision" }
chip-wasm-decision-host = { path = "../chip-wasm-decision-host" }
chip-fx = { path = "../chip-fx" }
chip-fx-native = { path = "../chip-fx-native" }
async-trait = "0.1"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal"] }
serde_json = "1"
# The benchmark's scripted provider port (a host-side double, as in `chip-fx`'s tests). The same
# workspace FX crates `chip-fx` uses. Dev-only: nothing in the shipped binary depends on it.
fx-core = { path = "../fx-core" }
fx-single-attempt = { path = "../fx-single-attempt" }

# The performance baseline (a measurement, not a test): `cargo bench -p stack-agent --bench baseline`.
[[bench]]
name = "baseline"
harness = false

# The shadow-mode micro-model evaluation: `cargo bench -p stack-agent --bench micro_eval`.
[[bench]]
name = "micro_eval"
harness = false
