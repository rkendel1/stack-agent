[package]
name = "chip-session"
version = "0.1.0"
edition = "2024"
description = "Reader for the durable session store written by the Zig fx (event_log_v1 under ~/.fx/sessions); no competing store"
license = "MIT"

# Persistence keeps its existing owner: the session directory format defined by the Zig
# implementation (docs/product/session-format.md). This crate reads and, in later slices, writes
# that same format. It depends on nothing from Chip's loop, FX or any provider.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
