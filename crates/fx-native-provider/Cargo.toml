[package]
name = "fx-native-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Native Rust providers behind the FX single-attempt ProviderPort (OpenAI-compatible chat completions)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
fx-core = { path = "../fx-core" }
fx-single-attempt = { path = "../fx-single-attempt" }
serde_json = "=1.0.154"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
