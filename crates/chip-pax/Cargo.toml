[package]
name = "chip-pax"
version = "0.1.0"
edition = "2024"
description = "Executor adapter that runs the pax.test capability through an independently installed PAX binary"
license = "MIT"

[dependencies]
chip-core = { path = "../chip-core" }
async-trait = "0.1"
serde = "1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
chip-inference = { path = "../chip-inference" }
async-trait = "0.1"
