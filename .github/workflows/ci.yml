name: CI

# The one pipeline for stack-agent: Chip, FX and the combined executable, from one checkout and one
# lockfile. Deterministic local providers only; no real model and no API key. Real-model runs are
# manual experiments outside this workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # The private-CA / proxy TLS tests in fx-native-provider print SKIPPED without `openssl` unless
  # this is set; in CI they must run (openssl is on the runner), as fx's own CI required.
  FX_REQUIRE_TLS_TESTS: 1

jobs:
  ci:
    name: Format, check, test, release binary, product
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The channel, components and the wasm32 target come from rust-toolchain.toml (1.97.0).
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `chip-agent-state` depends on FeltDB as native Rust from rkendel1/flow_db, pinned by commit
      # in Cargo.toml. That repository is private, so Cargo fetches it with the git CLI and a
      # read-only token from the FLOW_DB_READ_TOKEN secret (contents: read on rkendel1/flow_db).
      - name: FeltDB git dependency access
        env:
          FLOW_DB_READ_TOKEN: ${{ secrets.FLOW_DB_READ_TOKEN }}
        run: |
          if [ -z "$FLOW_DB_READ_TOKEN" ]; then
            echo "::error::FLOW_DB_READ_TOKEN is not set; Cargo cannot fetch the private rkendel1/flow_db dependency of chip-agent-state"
            exit 1
          fi
          git config --global url."https://x-access-token:${FLOW_DB_READ_TOKEN}@github.com/rkendel1/flow_db".insteadOf "https://github.com/rkendel1/flow_db"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      # Several Chip tests run the real `pax` (project observation and test truth). They fail, not
      # skip, without it. Pinned to the release chip-rs CI used: v0.4.1 at 674f3b3.
      - name: Install PAX v0.4.1 (674f3b3)
        run: |
          git clone --depth 1 --branch v0.4.1 https://github.com/rkendel1/pax "$RUNNER_TEMP/pax"
          test "$(git -C "$RUNNER_TEMP/pax" rev-parse HEAD)" = 674f3b3143874d1a692aca103b33f89da31a82ac
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/pax/Cargo.toml"
          echo "$RUNNER_TEMP/pax/target/release" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Workspace compilation
        run: cargo check --workspace --locked --all-targets

      - name: Workspace tests
        run: cargo test --workspace --locked

      - name: Release binary
        run: cargo build --locked --release --bin stack-agent

      - name: CLI smoke test
        run: |
          ./target/release/stack-agent --help
          ./target/release/stack-agent --version
          ./target/release/stack-agent --test

      # Also part of the workspace tests; run by name so a regression is visible as its own step.
      - name: Product integration (Chip -> FX path, tool round trip)
        run: cargo test --locked -p stack-agent --test product

      - name: Secret-redaction regression (sentinel credential)
        run: cargo test --locked -p stack-agent --test credential_redaction

      - name: CLI exit-code contract (work, verify, serve, one-shot prompt)
        run: cargo test --locked -p stack-agent --test exit_codes

      - name: Service events while work runs, and cancellation and deadline end to end
        run: cargo test --locked -p stack-agent --test cancellation

      - name: Delivery-certainty contract (FX outcomes and the CLI/service serialization)
        run: |
          cargo test --locked -p fx-native-provider --test conformance --test anthropic
          cargo test --locked -p chip-fx --test integrated
          cargo test --locked -p stack-agent --test fx_executor
          cargo test --locked -p chip-core --test work_control

      - name: Durable agent state through FeltDB (real file-backed store, restarts, races)
        run: |
          cargo test --locked -p chip-agent-state
          cargo test --locked -p stack-agent --test agent_state_cli

      - name: Completion evidence (tampering, stale evidence, PAX accounting)
        run: |
          cargo test --locked -p stack-agent --test completion_evidence
          cargo test --locked -p chip-pax --test evidence

      # FX_REQUIRE_TLS_TESTS=1 (set above) makes these fail, not skip, without openssl.
      - name: Custom CA, TLS and proxy boundaries (required)
        run: |
          cargo test --locked -p fx-native-provider --test private_ca --test tls_boundaries --test transport_boundaries --test proxy
          cargo test --locked -p stack-agent --test transport_boundaries

      - name: Wasm session modules under the Rust wasmi host
        run: cargo test --locked -p chip-wasm-host --test wasmi_conformance

      # Opt-in experiments: no model key and no network. The release binary runs the reference
      # experiment end to end; `experiment_cli` also pins that `work` is unchanged without it.
      - name: Experimentation seam (validation, comparison, isolation, redaction, production unchanged)
        run: |
          cargo test --locked -p chip-experiments
          cargo test --locked -p stack-agent --test experiment_cli
          ./target/release/stack-agent experiment validate reference.retries-isolated
          ./target/release/stack-agent experiment run reference.retries-isolated --report experiment-report.json
          ./target/release/stack-agent experiment run reference.retries-replay
          ./target/release/stack-agent experiment run stack-agent.observe-change

      # Opt-in automatic configuration: profiling, policy, scoring and the evidence feedback loop,
      # with a scripted model and a stand-in pax. `product_path` pins it to product crates.
      - name: Automatic configuration (selection, refusal, learning from verified outcomes)
        run: |
          cargo test --locked -p stack-agent --test autoconfig --test autoconfig_work --test product_path
          ./target/release/stack-agent experiment run autoconfig.change-context

      # Project and runtime learning: document integrity, scope isolation, promotion and the
      # feedback into --auto, through the binary with a scripted model and a stand-in pax.
      - name: Learning (records, scope isolation, validation, feedback into --auto)
        run: |
          cargo test --locked -p stack-agent --test learning --test learning_work --test product_path

      # What docs/known-issues.md (G) claims compiles for wasm32. The fx-host and chip-wasm-host
      # modules are also executed under wasmi by `cargo test -p chip-wasm-host --test
      # wasmi_conformance` (part of the workspace tests), which builds its own copies.
      - name: Wasm targets compile
        run: |
          cargo build --locked -p fx-core -p fx-single-attempt -p fx-wasm-abi -p fx-host --target wasm32-unknown-unknown --release
          cargo check --locked -p chip-core --target wasm32-unknown-unknown
          cargo build --locked -p chip-wasm-host --target wasm32-unknown-unknown --release
          cargo build --locked -p chip-wasm-decision --target wasm32-unknown-unknown --profile wasm-decision

      # Carried from chip-rs CI: Chip's host-driven Wasm session asks the host for everything, so the
      # module must have no import section.
      - name: chip-wasm-host requests no host imports
        run: |
          python3 - <<'PY'
          import sys
          d = open('target/wasm32-unknown-unknown/release/chip_wasm_host.wasm', 'rb').read()
          # Import section id is 2; a module with no imports has no such section.
          i = 8
          while i < len(d):
              sec = d[i]; i += 1
              n = 0; shift = 0
              while True:
                  b = d[i]; i += 1
                  n |= (b & 0x7f) << shift; shift += 7
                  if b < 0x80: break
              if sec == 2: sys.exit('chip_wasm_host.wasm requests host imports')
              i += n
          print('no imports')
          PY

      # The release artifact and the packaged smoke test: the packaged binary runs `serve` against an
      # event-stream model stand-in and real PAX (the stand-in mismatch fixed in chip-rs 2c22fd8).
      - name: Package and smoke-test the release artifact
        run: |
          scripts/package-release.sh dist
          scripts/smoke-test.sh dist/stack-agent-*.tar.gz

      # The FX crates' own dependency and source boundaries, carried from rkendel1/fx.
      - name: FX boundary gates
        run: |
          for crate in fx-core fx-single-attempt fx-native-provider fx-host fx-wasm-abi; do
            bash "crates/$crate/check-boundaries.sh"
          done

      - name: No Zig in the repository
        run: |
          if git ls-files | grep -E '(\.zig$|\.zig\.zon$|(^|/)build\.zig)'; then
            echo "Zig source or build files are not allowed in stack-agent" >&2
            exit 1
          fi
